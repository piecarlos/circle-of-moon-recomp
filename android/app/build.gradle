plugins {
    id 'com.android.application'
}

android {
    namespace 'org.circlemoon.app'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.circlemoon.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.2.6'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DCIRCLEMOON_BUILD_TESTS=OFF',
                          '-DCIRCLEMOON_BUILD_TOOLS=OFF',
                          '-DCIRCLEMOON_FETCH_SDL=ON',
                          '-DANDROID_STL=c++_static'
                cppFlags '-std=c++20 -O2'
                cFlags '-O2'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            // SDL3 Java sources (org.libsdl.app.*) synced from CMake FetchContent
            java.srcDirs += layout.buildDirectory.dir('generated/sdl3-java')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Ensure CMake configure runs (and syncs SDL3 Java sources) before compiling Java.
afterEvaluate {
    tasks.matching { it.name.startsWith('configureCMake') }.configureEach { cmakeTask ->
        cmakeTask.doLast {
            def cxxDir = file('.cxx')
            if (!cxxDir.exists()) return
            def found = null
            cxxDir.eachDirRecurse { dir ->
                if (found == null && dir.name == 'java' &&
                    dir.absolutePath.replace('\\', '/').endsWith('_deps/sdl3-src/android-project/app/src/main/java')) {
                    found = dir
                }
            }
            if (found != null) {
                copy {
                    from found
                    into layout.buildDirectory.dir('generated/sdl3-java')
                }
            }
        }
    }

    tasks.matching { it.name.startsWith('compile') && it.name.endsWith('JavaWithJavac') }.configureEach { javaTask ->
        def isDebug = javaTask.name.contains('Debug')
        javaTask.dependsOn(tasks.matching { t ->
            if (isDebug) {
                return t.name.startsWith('configureCMakeDebug')
            } else {
                return t.name.startsWith('configureCMakeRelWithDebInfo') || t.name.startsWith('configureCMakeRelease')
            }
        })
    }
}
